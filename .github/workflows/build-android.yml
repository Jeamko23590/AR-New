name: Build Android APK with ML Kit + ARCore

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17 (for Android SDK tools)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK (Updated for API 31)
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools
            platforms;android-31
            build-tools;31.0.0
            ndk;23.1.7779620

      - name: Switch to Java 11 (for AGP 7.x compatibility)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Cache Gradle dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x './body-measure/ANDROID APP/ARCoreMeasure/gradlew'

      - name: Verify ML Kit and ARCore dependencies
        working-directory: "./body-measure/ANDROID APP/ARCoreMeasure"
        run: |
          echo "=== Checking available Gradle configurations ==="
          ./gradlew tasks --all | grep -i "dependencies" || echo "No dependency tasks found"
          echo "=== Checking build.gradle for ML Kit dependencies ==="
          grep -E "(mlkit|arcore|pose-detection)" app/build.gradle || echo "No ML Kit dependencies found in build.gradle"

      - name: Build debug APK
        working-directory: "./body-measure/ANDROID APP/ARCoreMeasure"
        run: |
          echo "=== Starting build process ==="
          ./gradlew clean --no-daemon --stacktrace
          echo "=== Clean completed, starting assembleDebug ==="
          ./gradlew assembleDebug --no-daemon --stacktrace --info --debug 2>&1 | tee build-output.log
          echo "=== Build Output ==="
          cat build-output.log
          echo "=== Java Compilation Errors ==="
          ./gradlew compileDebugJavaWithJavac --no-daemon --stacktrace --info 2>&1 | tee java-errors.log
          cat java-errors.log

      - name: Run unit tests (if available)
        working-directory: "./body-measure/ANDROID APP/ARCoreMeasure"
        run: |
          ./gradlew test --no-daemon --stacktrace || echo "No unit tests found or tests failed"

      - name: Check APK for ML Kit and ARCore
        working-directory: "./body-measure/ANDROID APP/ARCoreMeasure"
        run: |
          echo "=== APK Analysis ==="
          find app/build/outputs -name "*.apk" -type f -exec echo "APK found: {}" \;
          if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "=== APK Contents Analysis ==="
            unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -E "(mlkit|arcore|pose)" || echo "No ML Kit/ARCore classes found in APK"
          fi

      - name: List build outputs
        working-directory: "./body-measure/ANDROID APP/ARCoreMeasure"
        run: |
          echo "=== APK files found ==="
          find app/build/outputs -name "*.apk" -type f
          echo "=== Full build outputs directory ==="
          ls -la app/build/outputs/
          echo "=== Debug directory contents ==="
          ls -la app/build/outputs/apk/debug/ || echo "Debug directory not found"
          echo "=== Build status ==="
          if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "✅ APK build successful"
          else
            echo "❌ APK build failed - no APK generated"
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: arcoremeasure-debug-apk-mlkit
          path: "body-measure/ANDROID APP/ARCoreMeasure/app/build/outputs/apk/debug/"
          if-no-files-found: warn

      - name: Upload build logs
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: "body-measure/ANDROID APP/ARCoreMeasure/build-output.log"
          if-no-files-found: ignore