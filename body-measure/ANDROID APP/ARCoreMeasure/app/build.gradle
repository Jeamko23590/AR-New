apply plugin: 'com.android.application'


android {
    compileSdkVersion 31
    defaultConfig {
        applicationId 'com.hl3hl3.arcoremeasure'
        // 24 is the minimum since ARCore only works with 24 and higher.
        minSdkVersion 24
        targetSdkVersion 31
        versionCode 13
        versionName "1.6"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    
    // Add Java compiler options for detailed error reporting
    tasks.withType(JavaCompile) {
        options.compilerArgs += ['-Xlint:deprecation', '-Xlint:unchecked']
    }
    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }

        lintOptions {
            abortOnError false
        }
    }
    productFlavors {
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    androidTestImplementation('androidx.test.espresso:espresso-core:3.3.0')
    testImplementation 'junit:junit:4.13.2'
    // ARCore library
    implementation 'com.google.ar:core:1.41.0'
    // Obj - a simple Wavefront OBJ file loader
    // https://github.com/javagl/Obj
    implementation 'de.javagl:obj:0.2.1'
    implementation 'androidx.appcompat:appcompat:1.3.1'
    implementation 'com.google.android.material:material:1.4.0'
    
    
    // ML Kit Pose Detection for human detection (versions available on Google Maven)
    implementation('com.google.mlkit:pose-detection:18.0.0-beta3') {
        exclude group: 'androidx.work', module: 'work-runtime'
        exclude group: 'com.google.mlkit', module: 'pose-detection-common'
    }
    implementation('com.google.mlkit:pose-detection-accurate:18.0.0-beta3') {
        exclude group: 'androidx.work', module: 'work-runtime'
        exclude group: 'com.google.mlkit', module: 'pose-detection-common'
    }
    // Explicit ODML image dependency matching published beta
    implementation 'com.google.android.odml:image:1.0.0-beta1'
    // CameraX for camera access (versions compatible with AGP 4.1.3 and compileSdk 30)
    implementation 'androidx.camera:camera-core:1.0.2'
    implementation 'androidx.camera:camera-camera2:1.0.2'
    implementation 'androidx.camera:camera-lifecycle:1.0.2'
    implementation 'androidx.camera:camera-view:1.0.0-alpha28'
}
