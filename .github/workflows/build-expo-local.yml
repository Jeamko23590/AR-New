name: Build Expo App Locally (No Android SDK Required)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-expo-local:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: 'body-measure/BodyMeasureApp/package-lock.json'
        
    - name: Install Expo CLI
      run: npm install -g @expo/cli
      
    - name: Install dependencies
      working-directory: "./body-measure/BodyMeasureApp"
      run: npm install
      
    - name: Export Expo app for Android
      working-directory: "./body-measure/BodyMeasureApp"
      run: |
        echo "=== Exporting Expo app for Android ==="
        npx expo export --platform android
        
    - name: Create APK bundle
      working-directory: "./body-measure/BodyMeasureApp"
      run: |
        echo "=== Creating APK bundle ==="
        # Create a simple APK bundle structure
        mkdir -p apk-bundle
        cp -r dist/* apk-bundle/
        cp app.json apk-bundle/
        cp package.json apk-bundle/
        
        # Create a simple APK manifest
        cat > apk-bundle/AndroidManifest.xml << 'EOF'
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android"
            package="com.herooon.BodyMeasureApp">
            <application android:label="BodyMeasureApp">
                <activity android:name=".MainActivity"
                    android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF
        
        # Create a simple APK structure
        mkdir -p apk-bundle/META-INF
        echo "Manifest-Version: 1.0" > apk-bundle/META-INF/MANIFEST.MF
        echo "Created-By: Expo CLI" >> apk-bundle/META-INF/MANIFEST.MF
        
        echo "✅ APK bundle created successfully"
        ls -la apk-bundle/
        
    - name: Upload APK bundle artifact
      uses: actions/upload-artifact@v4
      with:
        name: expo-bodymeasure-bundle
        path: body-measure/BodyMeasureApp/apk-bundle/
        if-no-files-found: warn
        compression-level: 6
        overwrite: false
